name: Service worker regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  service-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      # Built-in Node modules only: no dependency installation or build needed.
      - run: npm test
